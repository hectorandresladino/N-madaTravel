name: Importar fuentes Nómada Travel
on:
  push:
    paths: ['nomada_part06.b64']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expandir los 37 archivos del proyecto
        shell: bash
        run: |
          cat nomada_part{01..06}.b64 | base64 --decode > /tmp/nomada.tar.xz
          tar -xJf /tmp/nomada.tar.xz -C /tmp
          rsync -a /tmp/AgenciaViajes_Azure/ ./
          rm -f nomada_part{01..06}.b64 .github/workflows/importar-proyecto.yml
      - name: Publicar codigo completo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Agregar aplicacion Nomada Travel completa"
            git push origin HEAD:main
          fi
